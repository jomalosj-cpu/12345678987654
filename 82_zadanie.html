<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Светофор с кнопками</title><style>*{box-sizing:border-box}body{margin:0;padding:28px 16px;background:#f3f4f6;color:#1f2937;font:16px/1.5 Arial,sans-serif}.card{max-width:720px;margin:0 auto;padding:28px;background:#fff;border:1px solid #d1d5db;border-radius:12px}h1{margin-top:0;font-size:28px}h2{font-size:20px}button{padding:10px 14px;border:1px solid #9ca3af;border-radius:6px;background:#f9fafb;cursor:pointer;margin:5px 5px 5px 0}button:disabled{cursor:not-allowed;opacity:.5}input:not([type=checkbox]){padding:10px;border:1px solid #9ca3af;border-radius:6px;max-width:100%}label{display:block;margin:12px 0}.number{font-size:56px;font-weight:700;margin:20px 0}.signal{background:#262626;padding:12px;border-radius:28px;width:90px;display:grid;gap:10px;margin:12px auto}.light{height:56px;width:56px;border-radius:50%;opacity:.2}.red{background:#e53935}.yellow{background:#fbc02d}.green{background:#43a047}.light.active{opacity:1;box-shadow:0 0 10px currentColor}.controls{text-align:center}.book{padding:14px 0;border-bottom:1px solid #ddd}.book h2{margin-bottom:0}.check{display:flex;gap:8px;align-items:center}li{margin:4px 0}</style></head><body><main class="card"><h1>Интерактивный светофор</h1><div class="signal" aria-label="Светофор"><span class="light red" id="red"></span><span class="light yellow" id="yellow"></span><span class="light green" id="green"></span></div><p id="message" aria-live="polite">Стой</p><div class="controls"><button data-light="red">Красный</button><button data-light="yellow">Жёлтый</button><button data-light="green">Зелёный</button></div><button id="auto">Включить автоматическое переключение</button></main>
<script>
const order = ["red", "yellow", "green"];
const labels = {red: "Стой", yellow: "Внимание", green: "Иди"};
let active = "red", timer = null;
function setLight(name) {
  active = name;
  for (const color of order) document.querySelector(`#${color}`).classList.toggle("active", color === name);
  document.querySelector("#message").textContent = labels[name];
}
document.querySelectorAll("[data-light]").forEach(button => button.addEventListener("click", () => setLight(button.dataset.light)));
document.querySelector("#auto").addEventListener("click", event => {
  if (timer) { clearInterval(timer); timer = null; event.currentTarget.textContent = "Включить автоматическое переключение"; return; }
  event.currentTarget.textContent = "Остановить автоматическое переключение";
  timer = setInterval(() => setLight(order[(order.indexOf(active) + 1) % order.length]), 1500);
});
setLight("red");
</script></body></html>
